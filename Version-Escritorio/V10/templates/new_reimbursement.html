{% extends 'base.html' %}{% block title %}Nuevo reembolso / rendición | LANR{%
endblock %}{% block content %}
<div class="lanr-create-shell">
  <div class="lanr-create-head">
    <div>
      <a class="lanr-back-link" href="{{ url_for('reimbursements') }}"
        ><i class="fa-solid fa-arrow-left"></i> Reembolsos y rendiciones</a
      >
      <h1>Registrar reembolso / rendición</h1>
    </div>
  </div>
  <form class="card tramite-form" method="post" enctype="multipart/form-data">
    <div class="formgrid">
      <div class="field">
        <label>Tipo *</label
        ><select name="tipo" required>
          <option value="">Seleccione...</option>
          <option>Reembolso</option>
          <option>Rendición</option>
        </select>
      </div>
      <div class="field">
        <label>Fecha *</label
        ><input type="date" name="fecha" data-today required />
      </div>
      <div class="field">
        <label>Moneda *</label
        ><select name="moneda">
          <option value="PEN">Soles (S/)</option>
          <option value="USD">Dólares (US$)</option>
        </select>
      </div>
      <div class="field">
        <label>Monto *</label
        ><input type="number" step="0.01" min="0.01" name="monto" required />
      </div>
      <div class="field field-span-2">
        <label>Concepto *</label><input name="concepto" required />
      </div>
      <div class="field field-span-2">
        <label>Observaciones</label><textarea name="observaciones"></textarea>
      </div>
      <div class="field field-span-2">
        <label>Sustentos</label
        ><input
          type="file"
          name="documentos"
          multiple
          accept=".pdf,.jpg,.jpeg,.png,.webp"
        />
      </div>
    </div>
    <div class="form-actions">
      <a class="btn" href="{{ url_for('reimbursements') }}">Cancelar</a
      ><button class="btn primary">Registrar</button>
    </div>
  </form>
</div>
{% endblock %}
